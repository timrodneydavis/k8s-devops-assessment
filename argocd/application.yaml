apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: k8s-demo-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/timrodneydavis/k8s-devops-assessment.git
    targetRevision: main
    path: helm/k8s-demo-api

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
